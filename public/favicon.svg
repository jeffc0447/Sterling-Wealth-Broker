<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Sterling Wealth Broker Emblem">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0.15" y1="0.1" x2="0.85" y2="0.95">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="55%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Rounded institutional obsidian tile -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" />
  <rect x="20" y="20" width="472" height="472" rx="104" fill="none" stroke="#10b981" stroke-opacity="0.38" stroke-width="8" />

  <!-- Outer Precision Shield -->
  <path
    d="M256 78 L402 130 V248 C402 346 338 412 256 442 C174 412 110 346 110 248 V130 Z"
    fill="#062822"
    stroke="url(#shieldGrad)"
    stroke-width="24"
    stroke-linejoin="round"
  />

  <!-- Inner Vault Pillar / Stylized W-Crest & Upward Arrow -->
  <path
    d="M174 198 L208 320 L256 226 L304 320 L338 198"
    fill="none"
    stroke="#ecfdf5"
    stroke-width="28"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Apex Emerald/Gold Crown Diamond -->
  <polygon points="256,134 282,166 256,198 230,166" fill="url(#goldAccent)" />
</svg>
